{{- range .Values.segments }}
---
# Headless service required by StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: unified-dns-dhcp-{{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: unified-dns-dhcp
    segment: "{{ .name }}"
spec:
  clusterIP: None
  selector:
    app: unified-dns-dhcp
    segment: "{{ .name }}"
---
# Web UI + API access from within the cluster
apiVersion: v1
kind: Service
metadata:
  name: unified-dns-dhcp-{{ .name }}-api
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: unified-dns-dhcp
    segment: "{{ .name }}"
    component: api
spec:
  selector:
    app: unified-dns-dhcp
    segment: "{{ .name }}"
  ports:
    {{- if $.Values.services.webui.enabled }}
    - name: webui
      port: {{ $.Values.services.webui.port | default 5380 }}
      targetPort: {{ $.Values.services.webui.port | default 5380 }}
      protocol: TCP
    {{- end }}
  type: ClusterIP
{{- end }}
