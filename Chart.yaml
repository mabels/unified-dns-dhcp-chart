apiVersion: v2
name: unified-dns-dhcp-technicum
description: >-
  Technitium DNS Server with integrated DHCP for network segments.
  Replaces the unbound + knot-auth + kea stack with a single container.
  Supports DoH/DoT upstream forwarders by hostname, built-in DHCP with
  ARP conflict detection, and automatic DDNS on lease assignment.
type: application
version: 2.1.1
appVersion: "13"
