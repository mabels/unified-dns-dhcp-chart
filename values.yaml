global:
  namespace: dns-dhcp
  storage:
    className: "local-path"
  images:
    technitium: technitium/dns-server:latest
    configurator: denoland/deno:alpine
  # Technitium web UI admin password — change after first login
  adminPassword: "admin"
  # Hostname reported by Technitium as DNS_SERVER_DOMAIN (prefixed to the segment zone)
  dnsHostname: "dns"

network:
  podCIDR: "10.42.0.0/16"
  serviceCIDR: "10.43.0.0/16"
  podGateway: "10.42.0.1"
  # IPv6 equivalents — set to enable proper IPv6 default routing via net1
  podGatewayV6: ""       # e.g. "fd00:10:42:1::1"
  serviceCIDRv6: ""      # e.g. "fd00:10:43::/112" — routed via eth0

services:
  dns:
    enabled: true
  dhcp:
    enabled: true
  webui:
    enabled: true
    port: 5380

nodeSelector: {}
tolerations: []

ctRelay:
  enabled: false
  # Docker image for the relay sidecar.
  # Default uses socat — override if a segment needs custom forwarding logic.
  image: "alpine/socat"
  # Internal DNS name and port of the result-server service.
  resultServer: "segment-tester.dns-dhcp.svc:4711"
  # Port the sidecar listens on (must match what CT 104 posts to).
  listenPort: 4711
  # Optional: fully override the container command.
  # When unset the default socat TCP-LISTEN → TCP forward is used.
  # command: []

metrics:
  enabled: true  # set false when no API token secret exists yet

queryLogs:
  postgres:
    enabled: false
    appUrl: "https://download.technitium.com/dns/apps/QueryLogsPostgreSqlApp-v1.2.zip"
    connectionString: ""   # Host=...;Username=...;Password=...;  (must NOT include Database=)
    databaseName: "technicum-logs"
    maxLogDays: 0          # 0 = keep forever
    maxLogRecords: 0       # 0 = keep forever

# Network segments — one StatefulSet per segment
segments: []
